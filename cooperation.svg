<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 210">
  
  <!-- Text boxes -->
  <g font-family="Arial, sans-serif">
    <!-- Left text -->
    <text x="80" y="80" text-anchor="middle" font-size="24" fill="#000000">
      <tspan x="200" dy="0">Better computational</tspan>
      <tspan x="200" dy="30">cognitive models of</tspan>
      <tspan x="200" dy="30">human cooperation</tspan>
    </text>
    
    <!-- Right text -->
    <text x="600" y="80" text-anchor="middle" font-size="24" fill="#000000">
      <tspan x="600" dy="0">Smarter and more aligned</tspan>
      <tspan x="600" dy="30">AI agents that can</tspan>
      <tspan x="600" dy="30">cooperate with people</tspan>
    </text>
  </g>
  
  <!-- Arrows -->
  <g stroke="#000000" stroke-width="3" fill="none">
    <!-- Top arrow -->
    <path d="M 250,50 C 350,0 450,10 550,50" marker-end="url(#arrowhead)"/>
    <!-- Bottom arrow -->
    <path d="M 550,150 C 450,200 350,210 250,150" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
    </marker>
  </defs>
</svg>